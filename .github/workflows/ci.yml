name: CI

on:
  push:
  pull_request:

jobs:
  backend-lint-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check backend
        run: |
          node --check backend/src/server.js
          node --check backend/src/app.js
