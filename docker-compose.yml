version: '3.9'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: duame
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      PORT: 4000
      DB_URL: postgres://postgres:postgres@postgres:5432/duame
      JWT_SECRET: dev-secret
      SESSION_SECRET: dev-session
      PUBLIC_API_BASE: http://localhost:4000
      PUBLIC_WEB_BASE: http://localhost:3000
    depends_on:
      - postgres
    ports:
      - '4000:4000'

  frontend:
    build: ./frontend
    environment:
      REACT_APP_API_BASE: http://localhost:4000
    depends_on:
      - backend
    ports:
      - '3000:3000'

volumes:
  pgdata:
